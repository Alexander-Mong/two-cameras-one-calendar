<!doctype html>
<!-- The one demo: the page (bar, three rooms).
     Serve this folder with tools\serve.py and open it in a browser. Every address here is relative.
     The working title lives in ONE constant: TITLE at the top of js/app.js; the page title, the bar and "How we know" all read it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ai-assistance" content="Code and analysis written with AI coding assistants (Anthropic Claude), directed and reviewed by the team, Spark Squad. Data: NASA FIRMS.">

    <a class="tab" href="#answer" data-room="answer">The answer</a>

    <a class="tab" href="#record/calendar" data-room="record">The record</a>

  <ul class="choices" id="picker-list"></ul>
</div>
<div id="units" hidden></div>
<main>
  <section id="room-answer" class="room" aria-label="The answer"><p class="loading">Opening the record…</p></section>
  <section id="room-story" class="room" aria-label="How we know" hidden><div id="story-root"></div></section>
